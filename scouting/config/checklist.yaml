# Fit checklist consumed by lib/classify.js.
#
# known_stack is regenerated by `node lib/checklist-build.js` from
# resumes/{<pivot-a>,<pivot-b>}/en.md skills[] + profile/experience-bank.md.
# Only edit inside that marked block if you're fixing the source data it reads
# from — otherwise your edit will be overwritten on the next regen.
#
# deal_breakers / nice_to_have / soft_signals are hand-authored and never
# touched by the generator — these encode judgment calls (e.g. "Go required"
# is a deal-breaker) that the resume data alone doesn't express. Replace every
# example below with your own real preferences before running the scout.

# --- BEGIN AUTO-GENERATED (checklist-build.js) ---
known_stack:
  - Example group: Fill this in by running `node lib/checklist-build.js`
    after your resumes/experience-bank have real content, or edit by hand.
# --- END AUTO-GENERATED ---

deal_breakers:
  # A deal-breaker is a hard, non-negotiable disqualifier — the classifier
  # DISCARDs a posting outright when one of these is true, regardless of how
  # strong the rest of the match is. Keep these short and unambiguous.
  - id: example-language-required
    desc: "Replace with a language/stack you're not open to using as a primary tool (e.g. 'Go required as a primary/core language')"
  - id: example-citizenship-required
    desc: "Replace with any hard legal/authorization constraint that applies to you (e.g. work authorization you don't hold)"
  - id: example-rigid-onsite-required
    desc: >-
      Replace with your own onsite-location dealbreaker, e.g.: job text
      explicitly states onsite work is mandatory and non-negotiable in a
      location you can't reach — phrases like "must be based in," "fully
      onsite," "no remote option."

nice_to_have:
  # Signals that make a posting more attractive but aren't required.
  - Replace with your own nice-to-haves (e.g. "domain exposure to X", "AI-assisted dev tooling")

# Years-of-experience / seniority requirements ("10+ years", "Staff-level")
# are a common source of false negatives if you let the classifier treat them
# as hard requirements. Decide explicitly here whether a stack/domain match
# should override a posted seniority mismatch, in either direction (over- or
# under-leveled), and document your reasoning so it's not re-derived per run.

soft_signals:
  # Signals that shift a verdict between FIT/CLOSE/DISCARD without being an
  # automatic deal-breaker on their own. `weight` is one of: preferred,
  # acceptable, negative. Replace these with your own location/remote/brand
  # preferences.
  - id: example-location-remote-preferred
    weight: preferred
    desc: "Replace with your preferred remote/location signal (e.g. 'Remote, US/EU timezone')"
  - id: example-location-onsite-other
    weight: negative
    desc: >-
      Replace with your own onsite-elsewhere signal — onsite/hybrid in a
      location you're not willing to relocate for. Decide whether this caps
      the verdict at CLOSE (still worth a manual look) or should be promoted
      to a hard deal-breaker above.
  - id: example-remote-region-restricted
    weight: negative
    desc: >-
      "Remote" is not always global — some postings mean remote-within-a-
      region only. Don't trust an ATS's `isRemote`/`remoteType` flag or a bare
      location string; read the actual job text for "must be based in,"
      "eligible to work in," or a timezone/country restriction before treating
      a role as globally remote-accessible.
